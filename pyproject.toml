[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tv-control-center"
version = "0.0.2"
description = "TV Control Center — Universal Smart TV Management Suite for Sony BRAVIA, SHIELD, TCL, Hisense, Fire TV, Chromecast, Xiaomi."
readme = "README.md"
authors = [{ name = "Ashish Dungdung", email = "ashishdungdung@users.noreply.github.com" }]
license = { file = "LICENSE" }
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
keywords = ["sony", "bravia", "androidtv", "adb", "debloat", "optimization", "dashboard", "smarttv"]
dependencies = []

[project.urls]
Homepage = "https://github.com/ashishdungdung/tv-control-center"
Documentation = "https://github.com/ashishdungdung/tv-control-center#readme"
Repository = "https://github.com/ashishdungdung/tv-control-center.git"
Issues = "https://github.com/ashishdungdung/tv-control-center/issues"

[project.scripts]
tv-control-center = "bravia_control.cli:main"
bravia-control = "bravia_control.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["bravia_control*"]

[tool.setuptools.package-data]
bravia_control = ["static/*"]
